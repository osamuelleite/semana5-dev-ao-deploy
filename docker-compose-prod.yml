services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Sem "ports": o banco so e alcancavel pela rede interna do compose.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: backend,nginx,localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Sem "ports": acessado somente atraves do Nginx.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    expose:
      - "3000"
    # Sem "ports": acessado somente atraves do Nginx.

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data_prod:
